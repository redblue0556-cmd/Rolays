name: Build ROLAYS Android APK

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-apk:
    name: Build & Test ROLAYS APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK & Accept Licenses
        uses: android-actions/setup-android@v3

      - name: Ensure Android SDK licenses accepted
        run: yes | sdkmanager --licenses >/dev/null 2>&1 || true

      - name: Prepare debug keystore
        run: |
          if [ -f "debug.keystore.base64" ]; then
            base64 -d debug.keystore.base64 > debug.keystore
          elif [ ! -f "debug.keystore" ]; then
            keytool -genkeypair -v \
              -keystore debug.keystore \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.3.1"

      - name: Run unit tests
        run: gradle :app:testDebugUnitTest --no-daemon

      - name: Build Debug APK
        run: gradle :app:assembleDebug --no-daemon

      - name: Prepare Debug APK artifact
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk dist/ROLAYS-debug.apk

      - name: Upload ROLAYS Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: ROLAYS-debug-apk
          path: dist/ROLAYS-debug.apk
          if-no-files-found: error
          retention-days: 30

      - name: Build Signed Release APK (when keystore secrets are set)
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ] && [ -n "$STORE_PASSWORD" ] && [ -n "$KEY_PASSWORD" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "${GITHUB_WORKSPACE}/my-upload-key.jks"
            export KEYSTORE_PATH="${GITHUB_WORKSPACE}/my-upload-key.jks"
            gradle :app:assembleRelease --no-daemon
            mkdir -p dist-release
            cp app/build/outputs/apk/release/app-release.apk dist-release/ROLAYS-release.apk
          else
            echo "Release signing secrets not configured; skipping release APK."
          fi

      - name: Upload ROLAYS Release APK (if built)
        uses: actions/upload-artifact@v4
        with:
          name: ROLAYS-release-apk
          path: dist-release/ROLAYS-release.apk
          if-no-files-found: ignore
          retention-days: 30
